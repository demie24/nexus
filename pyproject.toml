[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS — AI-Orchestrated Decision Intelligence & Digital Twin Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Adam Demirel", email = "adamdemirel04@gmail.com" }
]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "bcrypt>=4.2.0",
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "networkx>=3.0.0"
]

[project.scripts]
nexus-sim = "apps.simulator.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "services*", "database*"]
